<!DOCTYPE html>
<html>
<head>
    <title>WASM Summation</title>
</head>
<body>
    <h1>Summation using WebAssembly</h1>
    <p id="result">Calculating...</p>

    <script src="sum.js"></script>
    <script>
        Module.onRuntimeInitialized = () => {
            // Call the C function 'sum' with arguments 5 and 10
            const output = Module._sum(5, 10);
            document.getElementById("result").innerText = "Sum: " + output;
        };
    </script>
</body>
</html>
